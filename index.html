<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/search.png" />
        <link
            rel="preconnect"
            href="https://fonts.googleapis.com"
            crossorigin="anonymous"
        />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin="anonymous"
        />
        <link
            rel="preload"
            as="style"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            media="print"
            onload="this.media='all'"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bang</title>
        <meta
            name="description"
            content="A better default search engine (with bangs!)"
        />
        <meta name="keywords" content="search, engine, bang, improved" />
        <script>
            (function () {
                var q = new URLSearchParams(window.location.search).get('q');
                if (!q) return;
                q = q.trim();
                var match = q.match(/!(\S+)/i);
                var bang = match ? match[1].toLowerCase() : null;
                var stored = localStorage.getItem('bang-map');
                if (!stored) return;
                var map = JSON.parse(stored);
                var defaultBang = localStorage.getItem('default-bang') || 'g';
                var url = (bang && map[bang]) || map[defaultBang];
                if (!url) return;
                var clean = q.replace(/!\S+\s*/i, '').trim();
                window.location.replace(
                    url.replace(
                        '{{{s}}}',
                        encodeURIComponent(clean).replace(/%2F/g, '/')
                    )
                );
            })();
        </script>
    </head>
    <body style="background-color: transparent">
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
